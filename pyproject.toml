[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsdr"
version = "0.1.0"
description = "Forgetting-aware support-gated doubly robust policy evaluation implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "matplotlib>=3.7", "scikit-learn>=1.3"]

[project.scripts]
fsdr = "fsdr.cli:main"

[tool.setuptools.packages.find]
include = ["fsdr*"]
